<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리 부부 공유 캘린더 💑</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wife: {
              light: '#fdf2f8',
              DEFAULT: '#ec4899',
              dark: '#db2777',
              border: '#fbcfe8'
            },
            husband: {
              light: '#eff6ff',
              DEFAULT: '#3b82f6',
              dark: '#2563eb',
              border: '#bfdbfe'
            },
            couple: {
              light: '#faf5ff',
              DEFAULT: '#8b5cf6',
              dark: '#7c3aed',
              border: '#ddd6fe'
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    @keyframes spin-custom {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-custom 1s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen overflow-hidden flex flex-col p-2 sm:p-3">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- 대한민국 공휴일 데이터 ---
    const KOREAN_HOLIDAYS = {
      "2024-01-01": "신정", "2024-02-09": "설날 연휴", "2024-02-10": "설날", "2024-02-11": "설날 연휴", "2024-02-12": "대체공휴일",
      "2024-03-01": "삼일절", "2024-04-10": "총선", "2024-05-05": "어린이날", "2024-05-06": "대체공휴일", "2024-05-15": "부처님오신날",
      "2024-06-06": "현충일", "2024-08-15": "광복절", "2024-09-16": "추석 연휴", "2024-09-17": "추석", "2024-09-18": "추석 연휴",
      "2024-10-01": "국군의날", "2024-10-03": "개천절", "2024-10-09": "한글날", "2024-12-25": "성탄절",

      "2025-01-01": "신정", "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴",
      "2025-03-01": "삼일절", "2025-03-03": "대체공휴일", "2025-05-05": "어린이날", "2025-05-06": "부처님오신날",
      "2025-06-06": "현충일", "2025-08-15": "광복절", "2025-10-03": "개천절", "2025-10-05": "추석 연휴",
      "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일", "2025-10-09": "한글날", "2025-12-25": "성탄절",

      "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
      "2026-05-25": "대체공휴일", "2026-06-03": "지방선거", "2026-06-06": "현충일", "2026-08-15": "광복절",
      "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절",

      "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일",
      "2027-03-01": "삼일절", "2027-05-05": "어린이날", "2027-05-13": "부처님오신날", "2027-06-06": "현충일",
      "2027-08-15": "광복절", "2027-08-16": "대체공휴일", "2027-09-14": "추석 연휴", "2027-09-15": "추석",
      "2027-09-16": "추석 연휴", "2027-10-03": "개천절", "2027-10-04": "대체공휴일", "2027-10-09": "한글날",
      "2027-10-11": "대체공휴일", "2027-12-25": "성탄절", "2027-12-27": "대체공휴일"
    };

    const getSolarHoliday = (year, month, day) => {
      const key = `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const solarRules = {
        '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일',
        '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절'
      };
      return solarRules[key] || null;
    };

    const getHolidayName = (year, month, day) => {
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      return KOREAN_HOLIDAYS[dateStr] || getSolarHoliday(year, month, day);
    };

    const getTodayString = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const INITIAL_SCHEDULES = [
      { id: 'sch_1', title: '주말 트레이더스 장보기 🛒', date: getTodayString(), allDay: false, startTime: '14:00', endTime: '15:30', assignee: 'couple', category: '장보기', completed: false, memo: '소고기, 올리브유, 세제' },
      { id: 'sch_2', title: '필라테스 1:1', date: getTodayString(), allDay: false, startTime: '10:30', endTime: '11:30', assignee: 'wife', category: '운동', completed: true, memo: '코어 운동' },
      { id: 'sch_3', title: '자동차 점검 & 세차', date: getTodayString(), allDay: false, startTime: '16:00', endTime: '17:30', assignee: 'husband', category: '집안일', completed: false, memo: '엔진오일 교체' },
      { id: 'sch_4', title: '기념일 저녁 식사 🥂', date: new Date(Date.now() + 86400000 * 2).toISOString().split('T')[0], allDay: false, startTime: '19:00', endTime: '21:00', assignee: 'couple', category: '기념일', completed: false, memo: '레스토랑 예약' }
    ];

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(getTodayString());
      
      const [sheetUrl, setSheetUrl] = useState(() => localStorage.getItem('google_sheet_webapp_url') || '');
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);

      const [schedules, setSchedules] = useState(() => {
        try {
          const saved = localStorage.getItem('couple_schedules_v2');
          return saved ? JSON.parse(saved) : INITIAL_SCHEDULES;
        } catch(e) {
          return INITIAL_SCHEDULES;
        }
      });

      const [filterAssignee, setFilterAssignee] = useState('all');

      // 모달 상태
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingSchedule, setEditingSchedule] = useState(null);
      const [formTitle, setFormTitle] = useState('');
      const [formDate, setFormDate] = useState(selectedDate);
      const [formAllDay, setFormAllDay] = useState(false);
      const [formStartTime, setFormStartTime] = useState('10:00');
      const [formEndTime, setFormEndTime] = useState('11:00');
      const [formAssignee, setFormAssignee] = useState('couple');
      const [formCategory, setFormCategory] = useState('데이트');
      const [formMemo, setFormMemo] = useState('');

      // 설정 모달
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [inputSheetUrl, setInputSheetUrl] = useState(sheetUrl);
      const [copySuccess, setCopySuccess] = useState(false);

      useEffect(() => {
        localStorage.setItem('couple_schedules_v2', JSON.stringify(schedules));
      }, [schedules]);

      // 구글 시트 동기화
      const fetchFromGoogleSheet = useCallback(async (urlToFetch = sheetUrl) => {
        if (!urlToFetch || !urlToFetch.startsWith('http')) return;
        setIsSyncing(true);
        try {
          const response = await fetch(urlToFetch);
          const data = await response.json();
          if (data && data.status === 'success' && Array.isArray(data.schedules)) {
            setSchedules(data.schedules);
            setLastSyncTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }));
          }
        } catch (err) {
          console.error('Fetch error:', err);
        } finally {
          setIsSyncing(false);
        }
      }, [sheetUrl]);

      const pushToGoogleSheet = async (newSchedules, urlToPush = sheetUrl) => {
        if (!urlToPush || !urlToPush.startsWith('http')) return;
        setIsSyncing(true);
        try {
          await fetch(urlToPush, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'sync', schedules: newSchedules })
          });
          setLastSyncTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }));
        } catch (err) {
          console.error('Push error:', err);
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        if (sheetUrl) fetchFromGoogleSheet();
        const handleFocus = () => { if (sheetUrl) fetchFromGoogleSheet(); };
        window.addEventListener('focus', handleFocus);
        return () => window.removeEventListener('focus', handleFocus);
      }, [sheetUrl, fetchFromGoogleSheet]);

      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth() + 1;

      const prevMonth = () => setCurrentDate(new Date(currentYear, currentMonth - 2, 1));
      const nextMonth = () => setCurrentDate(new Date(currentYear, currentMonth, 1));
      const goToToday = () => {
        const today = new Date();
        setCurrentDate(today);
        setSelectedDate(getTodayString());
      };

      // 달력 그리드 계산 (월 42 or 35칸 고정)
      const calendarDays = useMemo(() => {
        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
        const lastDate = new Date(currentYear, currentMonth, 0).getDate();
        const prevLastDate = new Date(currentYear, currentMonth - 1, 0).getDate();
        const days = [];

        for (let i = firstDay - 1; i >= 0; i--) {
          const d = prevLastDate - i;
          const prevMonthNum = currentMonth === 1 ? 12 : currentMonth - 1;
          const prevYearNum = currentMonth === 1 ? currentYear - 1 : currentYear;
          const dateStr = `${prevYearNum}-${String(prevMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({
            dateStr,
            day: d,
            isCurrentMonth: false,
            dayOfWeek: new Date(prevYearNum, prevMonthNum - 1, d).getDay(),
            holiday: getHolidayName(prevYearNum, prevMonthNum, d)
          });
        }

        for (let d = 1; d <= lastDate; d++) {
          const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayOfWeek = new Date(currentYear, currentMonth - 1, d).getDay();
          days.push({
            dateStr,
            day: d,
            isCurrentMonth: true,
            dayOfWeek,
            holiday: getHolidayName(currentYear, currentMonth, d)
          });
        }

        const totalSlots = days.length > 35 ? 42 : 35;
        const remaining = totalSlots - days.length;
        for (let d = 1; d <= remaining; d++) {
          const nextMonthNum = currentMonth === 12 ? 1 : currentMonth + 1;
          const nextYearNum = currentMonth === 12 ? currentYear + 1 : currentYear;
          const dateStr = `${nextYearNum}-${String(nextMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({
            dateStr,
            day: d,
            isCurrentMonth: false,
            dayOfWeek: new Date(nextYearNum, nextMonthNum - 1, d).getDay(),
            holiday: getHolidayName(nextYearNum, nextMonthNum, d)
          });
        }

        return days;
      }, [currentYear, currentMonth]);

      // 모달 열기
      const handleOpenAddModal = (dateStr = selectedDate) => {
        setEditingSchedule(null);
        setFormTitle('');
        setFormDate(dateStr);
        setFormAllDay(false);
        setFormStartTime('10:00');
        setFormEndTime('11:00');
        setFormAssignee('couple');
        setFormCategory('데이트');
        setFormMemo('');
        setIsModalOpen(true);
      };

      const handleOpenEditModal = (schedule) => {
        setEditingSchedule(schedule);
        setFormTitle(schedule.title);
        setFormDate(schedule.date);
        setFormAllDay(schedule.allDay);
        setFormStartTime(schedule.startTime || '09:00');
        setFormEndTime(schedule.endTime || '10:00');
        setFormAssignee(schedule.assignee);
        setFormCategory(schedule.category || '일정');
        setFormMemo(schedule.memo || '');
        setIsModalOpen(true);
      };

      const handleSaveSchedule = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        let nextSchedules;
        if (editingSchedule) {
          nextSchedules = schedules.map(s => s.id === editingSchedule.id ? {
            ...s,
            title: formTitle.trim(),
            date: formDate,
            allDay: formAllDay,
            startTime: formAllDay ? '' : formStartTime,
            endTime: formAllDay ? '' : formEndTime,
            assignee: formAssignee,
            category: formCategory,
            memo: formMemo.trim()
          } : s);
        } else {
          const newSchedule = {
            id: 'sch_' + Date.now(),
            title: formTitle.trim(),
            date: formDate,
            allDay: formAllDay,
            startTime: formAllDay ? '' : formStartTime,
            endTime: formAllDay ? '' : formEndTime,
            assignee: formAssignee,
            category: formCategory,
            completed: false,
            memo: formMemo.trim()
          };
          nextSchedules = [...schedules, newSchedule];
        }

        setSchedules(nextSchedules);
        setSelectedDate(formDate);
        setIsModalOpen(false);
        if (sheetUrl) pushToGoogleSheet(nextSchedules);
      };

      const handleDeleteSchedule = (id) => {
        if (confirm('이 일정을 삭제하시겠습니까?')) {
          const nextSchedules = schedules.filter(s => s.id !== id);
          setSchedules(nextSchedules);
          if (editingSchedule && editingSchedule.id === id) setIsModalOpen(false);
          if (sheetUrl) pushToGoogleSheet(nextSchedules);
        }
      };

      const handleToggleComplete = (id) => {
        const nextSchedules = schedules.map(s => {
          if (s.id === id) {
            const nextCompleted = !s.completed;
            if (nextCompleted && window.confetti) {
              window.confetti({ particleCount: 50, spread: 50, origin: { y: 0.7 } });
            }
            return { ...s, completed: nextCompleted };
          }
          return s;
        });
        setSchedules(nextSchedules);
        if (sheetUrl) pushToGoogleSheet(nextSchedules);
      };

      const handleSaveSheetUrl = (e) => {
        e.preventDefault();
        const trimmed = inputSheetUrl.trim();
        setSheetUrl(trimmed);
        localStorage.setItem('google_sheet_webapp_url', trimmed);
        setIsSettingsOpen(false);
        if (trimmed) fetchFromGoogleSheet(trimmed);
      };

      const selectedDateSchedules = useMemo(() => {
        return schedules
          .filter(s => s.date === selectedDate)
          .filter(s => filterAssignee === 'all' || s.assignee === filterAssignee)
          .sort((a, b) => {
            if (a.allDay && !b.allDay) return -1;
            if (!a.allDay && b.allDay) return 1;
            return (a.startTime || '00:00').localeCompare(b.startTime || '00:00');
          });
      }, [schedules, selectedDate, filterAssignee]);

      const getAssigneeStyle = (assignee) => {
        switch (assignee) {
          case 'wife':
            return { text: '아내', bg: 'bg-pink-100 text-pink-700 border-pink-200', dot: 'bg-pink-500', bar: 'bg-pink-500' };
          case 'husband':
            return { text: '남편', bg: 'bg-blue-100 text-blue-700 border-blue-200', dot: 'bg-blue-500', bar: 'bg-blue-500' };
          default:
            return { text: '함께', bg: 'bg-purple-100 text-purple-700 border-purple-200', dot: 'bg-purple-500', bar: 'bg-purple-500' };
        }
      };

      return (
        <div className="h-full flex flex-col max-w-7xl mx-auto w-full gap-2">
          
          {/* 1. 슬림 단일 상단바 (제목 + 년월 이동 + 연동상태 + 일정추가 버튼) */}
          <header className="bg-white rounded-xl shadow-xs border border-slate-200 px-3 py-2 flex items-center justify-between shrink-0 gap-2">
            
            {/* 왼쪽: 타이틀 및 년월 이동 */}
            <div className="flex items-center gap-2 sm:gap-3">
              <span className="text-xl">💑</span>
              <div className="flex items-center gap-1.5">
                <h1 className="text-base sm:text-lg font-black text-slate-800 tracking-tight">
                  {currentYear}년 {currentMonth}월
                </h1>
                <div className="flex items-center">
                  <button onClick={prevMonth} className="p-1 hover:bg-slate-100 rounded text-slate-600 font-bold text-xs" title="이전달">◀</button>
                  <button onClick={nextMonth} className="p-1 hover:bg-slate-100 rounded text-slate-600 font-bold text-xs" title="다음달">▶</button>
                </div>
                <button onClick={goToToday} className="px-2 py-0.5 text-[11px] font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md">
                  오늘
                </button>
              </div>
            </div>

            {/* 오른쪽: 연동 상태 + 동기화 + 일정추가 */}
            <div className="flex items-center gap-1.5">
              {sheetUrl ? (
                <button
                  onClick={() => fetchFromGoogleSheet()}
                  disabled={isSyncing}
                  className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold flex items-center gap-1"
                  title="구글 시트 실시간 동기화"
                >
                  <span className={`w-1.5 h-1.5 rounded-full bg-emerald-500 ${isSyncing ? 'animate-ping' : ''}`}></span>
                  <span className={isSyncing ? 'animate-spin-custom inline-block' : ''}>🔄</span>
                  <span className="hidden sm:inline">{isSyncing ? '동기화 중' : '구글 시트 연동됨'}</span>
                </button>
              ) : (
                <button
                  onClick={() => { setInputSheetUrl(sheetUrl); setIsSettingsOpen(true); }}
                  className="px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-lg text-xs font-bold flex items-center gap-1"
                >
                  <span>⚡</span> <span className="hidden sm:inline">구글 시트 연결</span>
                </button>
              )}

              <button
                onClick={() => { setInputSheetUrl(sheetUrl); setIsSettingsOpen(true); }}
                className="p-1.5 hover:bg-slate-100 text-slate-600 rounded-lg text-xs font-bold"
                title="설정"
              >
                ⚙️
              </button>

              <button
                onClick={() => handleOpenAddModal(selectedDate)}
                className="px-3 py-1 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg text-xs font-bold shadow-xs hover:opacity-95 flex items-center gap-1"
              >
                <span>➕</span> <span>일정 추가</span>
              </button>
            </div>

          </header>

          {/* 2. 한눈에 들어오는 1페이지 메인 뷰 (좌측: 캘린더 72% / 우측: 선택일정 28%) */}
          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-2 min-h-0">
            
            {/* 좌측 캘린더 (8~9 컬럼) */}
            <div className="lg:col-span-8 xl:col-span-9 bg-white rounded-xl shadow-xs border border-slate-200 p-2 sm:p-2.5 flex flex-col h-full min-h-0">
              
              {/* 요일 헤더 */}
              <div className="grid grid-cols-7 text-center font-bold text-xs mb-1 text-slate-500 shrink-0">
                <div className="text-red-500">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div className="text-blue-500">토</div>
              </div>

              {/* 캘린더 그리드 (화면 높이에 맞춰 꽉 차게 flex-1) */}
              <div className="grid grid-cols-7 gap-1 flex-1 min-h-0 select-none">
                {calendarDays.map((dObj, idx) => {
                  const isSelected = dObj.dateStr === selectedDate;
                  const isToday = dObj.dateStr === getTodayString();
                  const daySchedules = schedules.filter(s => s.date === dObj.dateStr);
                  const isSunday = dObj.dayOfWeek === 0;
                  const isSaturday = dObj.dayOfWeek === 6;
                  const isHoliday = !!dObj.holiday;

                  return (
                    <div
                      key={idx}
                      onClick={() => setSelectedDate(dObj.dateStr)}
                      onDoubleClick={() => handleOpenAddModal(dObj.dateStr)}
                      className={`p-1 rounded-lg border flex flex-col justify-start cursor-pointer transition-all overflow-hidden ${
                        isSelected
                          ? 'ring-2 ring-purple-500 border-purple-400 bg-purple-50/50 shadow-2xs z-10'
                          : 'border-slate-100 hover:border-slate-300 hover:bg-slate-50/80 bg-white'
                      } ${!dObj.isCurrentMonth ? 'opacity-35 bg-slate-50/40' : ''}`}
                    >
                      {/* 날짜 번호 & 공휴일 */}
                      <div className="flex items-center justify-between shrink-0 mb-0.5">
                        <span
                          className={`text-xs font-bold inline-flex items-center justify-center w-5 h-5 rounded-full ${
                            isToday
                              ? 'bg-purple-600 text-white font-black'
                              : isHoliday || isSunday
                              ? 'text-red-500 font-bold'
                              : isSaturday
                              ? 'text-blue-500 font-bold'
                              : 'text-slate-700'
                          }`}
                        >
                          {dObj.day}
                        </span>
                        
                        {dObj.holiday && (
                          <span className="text-[9px] bg-red-100 text-red-600 font-black px-1 rounded truncate max-w-[48px] sm:max-w-[65px]" title={dObj.holiday}>
                            {dObj.holiday}
                          </span>
                        )}
                      </div>

                      {/* 일정 칩 목록 (한눈에 시간/제목/색상 확인) */}
                      <div className="space-y-0.5 overflow-hidden flex-1">
                        {daySchedules.slice(0, 3).map((sch) => {
                          const style = getAssigneeStyle(sch.assignee);
                          return (
                            <div
                              key={sch.id}
                              className={`text-[10px] px-1 py-0.5 rounded truncate font-medium flex items-center gap-1 ${
                                sch.completed ? 'line-through opacity-40 bg-slate-100 text-slate-400' : style.bg
                              }`}
                              title={`${sch.allDay ? '[종일]' : sch.startTime} ${sch.title}`}
                            >
                              <span className={`w-1.5 h-1.5 rounded-full ${style.dot} shrink-0`} />
                              <span className="truncate">
                                {!sch.allDay && sch.startTime && <span className="font-mono text-[9px] opacity-80 mr-0.5">{sch.startTime}</span>}
                                {sch.title}
                              </span>
                            </div>
                          );
                        })}
                        {daySchedules.length > 3 && (
                          <div className="text-[9px] text-purple-600 font-bold px-0.5">
                            +{daySchedules.length - 3}개 더보기
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 하단 범례 */}
              <div className="flex items-center justify-between text-[11px] text-slate-500 pt-1.5 mt-1 border-t border-slate-100 shrink-0">
                <div className="flex items-center gap-3">
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-pink-500"></span> 아내</span>
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-blue-500"></span> 남편</span>
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-purple-500"></span> 함께</span>
                </div>
                <span className="text-[10px] text-slate-400">날짜 더블클릭 시 빠른 일정 등록</span>
              </div>

            </div>

            {/* 우측: 선택한 날짜 상세 일정 패널 (4~3 컬럼) */}
            <div className="lg:col-span-4 xl:col-span-3 bg-white rounded-xl shadow-xs border border-slate-200 p-3 flex flex-col h-full min-h-0">
              
              {/* 패널 헤더 */}
              <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-100 shrink-0">
                <div>
                  <h2 className="text-sm sm:text-base font-black text-slate-800 flex items-center gap-1.5">
                    <span>📅 {selectedDate}</span>
                    {KOREAN_HOLIDAYS[selectedDate] && (
                      <span className="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">
                        {KOREAN_HOLIDAYS[selectedDate]}
                      </span>
                    )}
                  </h2>
                  <p className="text-[11px] text-slate-400 font-medium">
                    일정 {selectedDateSchedules.length}개
                  </p>
                </div>

                {/* 담당자 필터 */}
                <div className="flex bg-slate-100 p-0.5 rounded-lg text-[10px] font-bold text-slate-600 gap-0.5">
                  <button onClick={() => setFilterAssignee('all')} className={`px-1.5 py-0.5 rounded ${filterAssignee === 'all' ? 'bg-white text-slate-900 shadow-2xs' : ''}`}>전체</button>
                  <button onClick={() => setFilterAssignee('wife')} className={`px-1.5 py-0.5 rounded ${filterAssignee === 'wife' ? 'bg-pink-500 text-white' : ''}`}>아내</button>
                  <button onClick={() => setFilterAssignee('husband')} className={`px-1.5 py-0.5 rounded ${filterAssignee === 'husband' ? 'bg-blue-500 text-white' : ''}`}>남편</button>
                  <button onClick={() => setFilterAssignee('couple')} className={`px-1.5 py-0.5 rounded ${filterAssignee === 'couple' ? 'bg-purple-600 text-white' : ''}`}>함께</button>
                </div>
              </div>

              {/* 일정 목록 (스크롤 가능) */}
              <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1 min-h-0">
                {selectedDateSchedules.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center text-slate-400 p-4 border border-dashed border-slate-200 rounded-xl">
                    <span className="text-2xl mb-1">☕</span>
                    <p className="text-xs font-semibold">등록된 일정이 없습니다.</p>
                    <button
                      onClick={() => handleOpenAddModal(selectedDate)}
                      className="mt-2 text-xs text-purple-600 font-bold hover:underline"
                    >
                      + 새 일정 추가하기
                    </button>
                  </div>
                ) : (
                  selectedDateSchedules.map((sch) => {
                    const style = getAssigneeStyle(sch.assignee);
                    return (
                      <div
                        key={sch.id}
                        className={`p-2.5 rounded-xl border border-slate-200 transition-all ${
                          sch.completed ? 'opacity-60 bg-slate-50' : 'bg-slate-50/50 hover:bg-white hover:shadow-2xs'
                        }`}
                      >
                        <div className="flex items-start justify-between gap-1.5">
                          <div className="flex items-start gap-2 flex-1 min-w-0">
                            <input
                              type="checkbox"
                              checked={sch.completed}
                              onChange={() => handleToggleComplete(sch.id)}
                              className="mt-0.5 w-4 h-4 rounded text-purple-600 focus:ring-purple-500 cursor-pointer accent-purple-600 shrink-0"
                            />
                            <div className="min-w-0 flex-1">
                              <h3 className={`text-xs sm:text-sm font-bold text-slate-800 truncate ${sch.completed ? 'line-through text-slate-400' : ''}`}>
                                {sch.title}
                              </h3>

                              <div className="flex flex-wrap items-center gap-1 mt-1 text-[10px]">
                                <span className="font-bold text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-100">
                                  {sch.allDay ? '⏰ 종일' : `⏰ ${sch.startTime} ~ ${sch.endTime}`}
                                </span>
                                <span className={`px-1.5 py-0.5 rounded font-semibold ${style.bg}`}>
                                  {style.text}
                                </span>
                                {sch.category && (
                                  <span className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">
                                    #{sch.category}
                                  </span>
                                )}
                              </div>

                              {sch.memo && (
                                <p className="text-[11px] text-slate-600 mt-1 bg-white p-1.5 rounded border border-slate-100 font-normal">
                                  📝 {sch.memo}
                                </p>
                              )}
                            </div>
                          </div>

                          <div className="flex items-center gap-0.5 shrink-0">
                            <button onClick={() => handleOpenEditModal(sch)} className="p-1 text-slate-400 hover:text-slate-700 text-xs" title="수정">✏️</button>
                            <button onClick={() => handleDeleteSchedule(sch.id)} className="p-1 text-slate-400 hover:text-red-600 text-xs" title="삭제">🗑️</button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

            </div>

          </main>

          {/* 일정 등록/수정 모달 */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-2xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 border border-slate-100 animate-in fade-in duration-150">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100 mb-3">
                  <h3 className="text-base font-black text-slate-800">
                    {editingSchedule ? '✏️ 일정 수정' : '➕ 새로운 일정 등록'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveSchedule} className="space-y-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">일정 제목 *</label>
                    <input
                      type="text"
                      required
                      placeholder="예: 트레이더스 장보기, 필라테스"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">담당자 *</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      <button
                        type="button"
                        onClick={() => setFormAssignee('wife')}
                        className={`py-1.5 rounded-lg text-xs font-bold border transition-all ${formAssignee === 'wife' ? 'bg-pink-500 text-white border-pink-500' : 'bg-slate-50 text-slate-700'}`}
                      >
                        👩 아내(나)
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormAssignee('husband')}
                        className={`py-1.5 rounded-lg text-xs font-bold border transition-all ${formAssignee === 'husband' ? 'bg-blue-500 text-white border-blue-500' : 'bg-slate-50 text-slate-700'}`}
                      >
                        👨 남편
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormAssignee('couple')}
                        className={`py-1.5 rounded-lg text-xs font-bold border transition-all ${formAssignee === 'couple' ? 'bg-purple-600 text-white border-purple-600' : 'bg-slate-50 text-slate-700'}`}
                      >
                        💑 우리 함께
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">날짜 *</label>
                    <input
                      type="date"
                      required
                      value={formDate}
                      onChange={(e) => setFormDate(e.target.value)}
                      className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-[11px] font-bold text-slate-700">시간 설정</label>
                      <label className="text-[11px] text-slate-600 font-medium flex items-center gap-1 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={formAllDay}
                          onChange={(e) => setFormAllDay(e.target.checked)}
                          className="w-3.5 h-3.5 rounded text-purple-600 accent-purple-600"
                        />
                        종일 일정
                      </label>
                    </div>

                    {!formAllDay && (
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="time"
                          value={formStartTime}
                          onChange={(e) => setFormStartTime(e.target.value)}
                          className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                        />
                        <input
                          type="time"
                          value={formEndTime}
                          onChange={(e) => setFormEndTime(e.target.value)}
                          className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                        />
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">카테고리</label>
                    <select
                      value={formCategory}
                      onChange={(e) => setFormCategory(e.target.value)}
                      className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    >
                      <option value="데이트">💕 데이트</option>
                      <option value="집안일">🧹 집안일/청소</option>
                      <option value="장보기">🛒 장보기</option>
                      <option value="운동">🏃 운동/건강</option>
                      <option value="기념일">🎂 기념일/가족</option>
                      <option value="병원">🏥 병원/검진</option>
                      <option value="개인약속">☕ 개인 약속</option>
                      <option value="업무">💼 업무/회의</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">메모 (선택)</label>
                    <input
                      type="text"
                      placeholder="준비물, 장소 등"
                      value={formMemo}
                      onChange={(e) => setFormMemo(e.target.value)}
                      className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                    {editingSchedule && (
                      <button
                        type="button"
                        onClick={() => handleDeleteSchedule(editingSchedule.id)}
                        className="px-3 py-1.5 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg mr-auto"
                      >
                        삭제
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-3 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-xs font-bold bg-purple-600 hover:bg-purple-700 text-white rounded-lg shadow-sm"
                    >
                      {editingSchedule ? '수정' : '저장'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 구글 시트 연동 설정 모달 */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-2xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-5 border border-slate-100 max-h-[90vh] overflow-y-auto custom-scrollbar animate-in fade-in duration-150">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100 mb-3">
                  <h3 className="text-base font-black text-slate-800">📊 구글 스프레드시트 연동 설정</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveSheetUrl} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Google Apps Script 웹 앱 URL</label>
                    <input
                      type="url"
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={inputSheetUrl}
                      onChange={(e) => setInputSheetUrl(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                  </div>
                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl">
                      URL 저장 및 동기화
                    </button>
                    {sheetUrl && (
                      <button
                        type="button"
                        onClick={() => {
                          if (confirm('연동을 해제하시겠습니까?')) {
                            setSheetUrl('');
                            setInputSheetUrl('');
                            localStorage.removeItem('google_sheet_webapp_url');
                            setIsSettingsOpen(false);
                          }
                        }}
                        className="px-3 py-2 text-red-600 hover:bg-red-50 text-xs font-bold rounded-xl border border-red-200"
                      >
                        연동 해제
                      </button>
                    )}
                  </div>
                </form>

                <div className="mt-4 pt-4 border-t border-slate-100">
                  <h4 className="font-bold text-xs text-slate-800 mb-2">📖 1분 연동 가이드</h4>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 space-y-1.5 leading-relaxed">
                    <p>1. <a href="https://sheets.google.com" target="_blank" className="text-purple-600 underline font-bold">구글 스프레드시트</a>에서 새 시트 생성</p>
                    <p>2. [확장 프로그램] → [Apps Script] 클릭</p>
                    <p>3. 깃허브 저장소의 <b>google_sheet_code.js</b> 내용을 붙여넣고 저장(💾)</p>
                    <p>4. 우측 상단 [배포] → [새 배포] (유형: 웹 앱, 권한: 모든 사용자) 후 발급된 URL을 위 입력창에 등록하면 끝!</p>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
